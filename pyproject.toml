[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceflow"
version = "0.1.0"
description = "Invoice processing engine for supplier invoices"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceflow"]