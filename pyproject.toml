[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceflow"
version = "0.1.0"
description = "Invoice processing engine for supplier invoices"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "openpyxl>=3.1.5",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceflow"]